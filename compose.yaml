services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    
    # Native L2 visibility for auto-discovery without root privileges (use 'bridge' mode on macOS, 'host' on Linux)
    network_mode: host

    stop_signal: SIGTERM
  
    # Safe for both systems (ignored if hardware is missing on macOS)
    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      - TZ=Europe/Berlin
    
    volumes:
      - ~/app-data/homeassistant:/config:Z
      
    restart: unless-stopped

    group_add:
      - dialout

    logging:
      driver: k8s-file
      options:
        max-size: "10mb"
        max-file: "3"

    # USB Hardware Access (e.g., Zigbee/Z-Wave coordinators)
    #
    # CRITICAL HOST REQUIREMENT (Linux only):
    # Your host user MUST belong to the 'dialout' group.
    # Run this command on your terminal and REBOOT the server:
    #   sudo usermod -aG dialout $USER
    #
    # INSTRUCTION: To activate, uncomment 'devices:' and ONE hardware line below:
    #devices:
    #  - /dev/serial/by-id/usb-ITRIAD_Sonoff_Zigbee_3.0_USB_Dongle_Plus_0001-if00-port0:/dev/ttyUSB0
    #  - /dev/serial/by-id/usb-Aeotec_Z-Stick_Gen5_Plus_0001-if00-port0:/dev/ttyACM0
